name: Benchmark

# Manual only, so every minute spent is one somebody chose to spend. GitHub's runner always runs
# alongside as the baseline (free in a public repo). See METHODOLOGY.md.
on:
  workflow_dispatch:
    inputs:
      providers:
        description: "Providers to run besides GitHub, comma separated (keys in runners.json), e.g. blacksmith"
        type: string
        default: blacksmith
      arch:
        description: Architecture
        type: choice
        options: [x64, arm, both]
        default: x64
      vcpus:
        description: Provider runner size. GitHub's public-repo runner is 4 vCPU and always runs.
        type: choice
        options: ["4", "2", both]
        default: "4"
      cache:
        description: "cold: no cache. warm: one priming job fills each runner's cache, then the timed runs restore it."
        type: choice
        options: [cold, warm, both]
        default: cold
      repeats:
        description: Runs per runner and cache mode (1 to 10), for a median
        type: number
        default: 3
      dry_run:
        description: Don't save results to the results branch
        type: boolean
        default: false

permissions:
  contents: read

env:
  # The workload: Zustand's own CI steps (install, typecheck, test, build), pinned so every run does
  # the same work. Changing any of these means a new results schema (see METHODOLOGY.md).
  WORKLOAD_REPOSITORY: pmndrs/zustand
  WORKLOAD_REF: 9fed2eb2f3af672da9f7bf694b996df3831fc207
  PNPM_VERSION: 11.3.0
  NODE_VERSION: "24"

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      bench: ${{ steps.plan.outputs.bench }}
      prime: ${{ steps.plan.outputs.prime }}
      has_prime: ${{ steps.plan.outputs.has_prime }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - id: plan
        env:
          PROVIDERS: ${{ inputs.providers }}
          ARCH: ${{ inputs.arch }}
          VCPUS: ${{ inputs.vcpus }}
          CACHE: ${{ inputs.cache }}
          REPEATS: ${{ inputs.repeats }}
        run: node scripts/plan.mjs

  # Warm runs only: install once on each runner and save the pnpm store under a key unique to this
  # run, so the timed jobs restore exactly this cache and nothing older.
  prime:
    needs: plan
    if: needs.plan.outputs.has_prime == 'true'
    name: prime ${{ matrix.id }}
    runs-on: ${{ matrix.label }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.prime) }}
    steps:
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ env.WORKLOAD_REPOSITORY }}
          ref: ${{ env.WORKLOAD_REF }}
          persist-credentials: false
      - name: Setup pnpm
        run: |
          npm install --global pnpm@${{ env.PNPM_VERSION }}
          echo "PNPM_STORE=$(pnpm store path --silent)" >> "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache/save@v4
        with:
          path: ${{ env.PNPM_STORE }}
          key: bench-pnpm-${{ matrix.cacheKey }}-${{ github.run_id }}-${{ github.run_attempt }}

  bench:
    needs: [plan, prime]
    # Runs after priming, or straight away when there's nothing to prime.
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    name: bench ${{ matrix.id }}
    runs-on: ${{ matrix.label }}
    # A hung or never-started runner can't burn more than this.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.bench) }}
    steps:
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Machine info
        env:
          JOB_ID: ${{ matrix.id }}
        run: |
          export JOB_DIR="$RUNNER_TEMP/job"
          mkdir -p "$JOB_DIR"
          echo "JOB_DIR=$JOB_DIR" >> "$GITHUB_ENV"
          node -e '
            const fs = require("node:fs"), os = require("node:os");
            const osRelease = (() => { try { return /PRETTY_NAME="?([^"\n]*)/.exec(fs.readFileSync("/etc/os-release", "utf8"))[1]; } catch { return null; } })();
            const info = {
              id: process.env.JOB_ID,
              cpu: os.cpus()[0]?.model?.trim() ?? null,
              vcpus: os.availableParallelism(),
              memGb: Math.round(os.totalmem() / 1e8) / 10,
              kernel: os.release(),
              os: osRelease,
              runnerName: process.env.RUNNER_NAME ?? null,
            };
            console.log(info);
            fs.writeFileSync(process.env.JOB_DIR + "/machine.json", JSON.stringify(info));
          '
      - name: Checkout workload
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ env.WORKLOAD_REPOSITORY }}
          ref: ${{ env.WORKLOAD_REF }}
          persist-credentials: false
      - name: Setup pnpm
        run: |
          npm install --global pnpm@${{ env.PNPM_VERSION }}
          echo "PNPM_STORE=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      # The timed stages. Each one writes its own time in milliseconds to stages.txt (only when it
      # succeeds); their step names are what scripts/collect.mjs reads. Cold jobs use no cache.
      - name: Start restore timer
        if: matrix.cache == 'warm'
        run: echo "RESTORE_START=$(date +%s%3N)" >> "$GITHUB_ENV"
      - name: Restore cache
        if: matrix.cache == 'warm'
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.PNPM_STORE }}
          key: bench-pnpm-${{ matrix.cacheKey }}-${{ github.run_id }}-${{ github.run_attempt }}
          fail-on-cache-miss: true
      - name: Install
        run: |
          if [ -n "${RESTORE_START:-}" ]; then echo "restore $(( $(date +%s%3N) - RESTORE_START ))" >> "$JOB_DIR/stages.txt"; fi
          s=$(date +%s%3N)
          pnpm install --frozen-lockfile --prefer-offline
          echo "install $(( $(date +%s%3N) - s ))" >> "$JOB_DIR/stages.txt"
      - name: Typecheck
        run: |
          s=$(date +%s%3N)
          pnpm run test:types
          echo "typecheck $(( $(date +%s%3N) - s ))" >> "$JOB_DIR/stages.txt"
      - name: Test
        run: |
          s=$(date +%s%3N)
          pnpm run test:spec
          echo "test $(( $(date +%s%3N) - s ))" >> "$JOB_DIR/stages.txt"
      - name: Build
        run: |
          s=$(date +%s%3N)
          pnpm run build
          echo "build $(( $(date +%s%3N) - s ))" >> "$JOB_DIR/stages.txt"

      - name: Upload job record
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: job-${{ matrix.provider }}-${{ matrix.arch }}-${{ matrix.vcpus }}-${{ matrix.cache }}-${{ matrix.repeat }}
          path: ${{ runner.temp }}/job/
          retention-days: 7

  collect:
    needs: [plan, bench]
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write # pushes to the results branch
      actions: read # reads this run's job timings
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      # One directory per job: machine.json and stages.txt.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: job-*
          path: ${{ runner.temp }}/records
      - name: Collect timings
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          PROVIDERS: ${{ inputs.providers }}
          ARCH: ${{ inputs.arch }}
          VCPUS: ${{ inputs.vcpus }}
          CACHE: ${{ inputs.cache }}
          REPEATS: ${{ inputs.repeats }}
        run: |
          cp -r scripts "$RUNNER_TEMP/scripts"
          node scripts/collect.mjs "$RUNNER_TEMP/records" "$RUNNER_TEMP/out"
          node scripts/summarize.mjs "$RUNNER_TEMP/out" | sed 's/^# .*/# This dispatch/' >> "$GITHUB_STEP_SUMMARY"
      - name: Save to the results branch
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin results >/dev/null; then
            git fetch --depth 1 origin results
            git checkout -B results FETCH_HEAD
          else
            git checkout --orphan results
            git rm -rf --quiet .
          fi
          # Two dispatches finishing together race for the branch: start again from theirs and retry.
          for attempt in 1 2 3; do
            mkdir -p results
            cp "$RUNNER_TEMP"/out/*.json results/
            node "$RUNNER_TEMP/scripts/summarize.mjs" results > README.md
            git add results README.md
            git commit --quiet -m "Results for run ${{ github.run_id }}"
            git push origin results && exit 0
            git fetch --depth 1 origin results
            git reset --quiet --hard FETCH_HEAD
          done
          exit 1
